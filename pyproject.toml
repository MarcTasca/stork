[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stork"
version = "0.1.0"
description = "Surrogate gradient library based on PyTorch"
readme = "README.md"
requires-python = ">=3.10,<3.14"
license = { file = "LICENSE.md" }
authors = [
    { name = "Friedemann Zenke", email = "fzenke@gmail.com" },
]
dependencies = [
    "h5py",
    "jupyter",
    "matplotlib",
    "numpy",
    "pandas",
    "randman @ git+https://github.com/fzenke/randman.git",
    "scipy",
    "seaborn",
    "soundfile",
    "tables",
    "tonic",
    "torch",
    "torchvision",
]

[tool.setuptools.packages.find]
include = ["stork*"]

[tool.uv]
# librosa only sets a lower bound for numba, which allowed uv 0.9 to select an
# obsolete release whose llvmlite dependency cannot build on modern Python.
constraint-dependencies = [
    "librosa>=0.11",
    "numba>=0.61.2",
]
